name: Solfa backend tests

on:
  push:
    branches: [main]
    paths: ['server/song-to-tonic-solfa/**', '.github/workflows/solfa-backend-tests.yml']
  pull_request:
    paths: ['server/song-to-tonic-solfa/**', '.github/workflows/solfa-backend-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/song-to-tonic-solfa/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/song-to-tonic-solfa/backend/pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -v
